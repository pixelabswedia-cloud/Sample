<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Kecantikan | Minimalist & Clean</title>
    <style>
        /* Pengaturan Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #333;
            background-color: #faf9f8; /* Warna latar belakang off-white/nude */
            line-height: 1.6;
        }

        /* Navigasi / Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eaeaea;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Bagian Hero (Spanduk Utama) */
        .hero {
            background-color: #f7e9e8; /* Warna pink blush khas Rare Beauty */
            text-align: center;
            padding: 120px 20px;
        }
        .hero h1 {
            font-size: 3.5rem;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #555;
        }
        .btn-primary {
            background-color: #333;
            color: #fff;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background-color: #555;
        }

        /* Bagian Produk */
        .products-section {
            padding: 80px 5%;
            text-align: center;
        }
        .products-section h2 {
            font-size: 2rem;
            margin-bottom: 50px;
            font-weight: 500;
        }
        .product-grid {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .product-card {
            width: 32%;
            text-align: left;
            background: #fff;
            padding-bottom: 20px;
        }
        .product-card img {
            width: 100%;
            height: auto;
            aspect-ratio: 4/5;
            object-fit: cover;
            background-color: #eaeaea;
        }
        .product-info {
            padding: 15px 10px;
        }
        .product-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .product-price {
            color: #666;
            font-size: 1rem;
        }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            .product-grid {
                flex-direction: column;
            }
            .product-card {
                width: 100%;
                margin-bottom: 20px;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
            nav {
                display: none; /* Disembunyikan untuk kesederhanaan di HP */
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Merek Kosmetik</div>
        <nav>
            <a href="#">Belanja</a>
            <a href="#">Tentang Kami</a>
            <a href="#">Masuk</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Kecantikan yang Terasa Nyata.</h1>
        <p>Rayakan keunikanmu dengan koleksi terbaru kami yang ringan dan tahan lama.</p>
        <a href="#" class="btn-primary">Belanja Sekarang</a>
    </section>

    <section class="products-section">
        <h2>Pilihan Favorit</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://via.placeholder.com/400x500/f7e9e8/333333?text=Gambar+Blush" alt="Liquid Blush">
                <div class="product-info">
                    <div class="product-name">Soft Pinch Liquid Blush</div>
                    <div class="product-price">Rp 350.000</div>
                </div>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/400x500/f7e9e8/333333?text=Gambar+Foundation" alt="Foundation">
                <div class="product-info">
                    <div class="product-name">Liquid Touch Foundation</div>
                    <div class="product-price">Rp 480.000</div>
                </div>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/400x500/f7e9e8/333333?text=Gambar+Lip+Oil" alt="Lip Oil">
                <div class="product-info">
                    <div class="product-name">Tinted Lip Oil</div>
                    <div class="product-price">Rp 290.000</div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
