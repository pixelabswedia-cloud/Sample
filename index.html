<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Jualan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <section class="bg-white pb-8 pt-10 px-4 text-center shadow-sm">
        <div class="w-24 h-24 bg-blue-500 rounded-full mx-auto mb-4 flex items-center justify-center text-white text-3xl font-bold shadow-lg">
            S
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Nama Toko Anda</h1>
        <p class="text-sm text-gray-500 mt-2 italic">"Solusi belanja praktis dari rumah saja"</p>
    </section>

    <div class="max-w-md mx-auto px-4 -mt-4">
        <a href="https://wa.me/628123456789" class="bg-green-500 hover:bg-green-600 text-white flex items-center justify-center py-4 rounded-xl shadow-xl transition-transform active:scale-95">
            <i class="fab fa-whatsapp text-2xl mr-3"></i>
            <span class="font-bold uppercase tracking-wider">Pesan via WhatsApp</span>
        </a>
    </div>

    <main class="max-w-md mx-auto p-4 mt-4">
        <h2 class="text-lg font-bold mb-4 flex items-center">
            <i class="fas fa-shopping-bag mr-2 text-blue-500"></i> Produk Unggulan
        </h2>

        <div class="grid grid-cols-1 gap-4">
            
            <div class="bg-white p-3 rounded-lg shadow-sm flex items-center border border-gray-200">
                <img src="https://via.placeholder.com/100" alt="Produk" class="w-20 h-20 object-cover rounded-md bg-gray-200">
                <div class="ml-4 flex-1">
                    <h3 class="font-semibold text-gray-800 leading-tight">Nama Produk Keren</h3>
                    <p class="text-blue-600 font-bold mt-1 text-sm">Rp 50.000</p>
                    <button class="mt-2 text-xs bg-gray-100 px-2 py-1 rounded text-gray-600 border border-gray-200">Stok Tersedia</button>
                </div>
            </div>

            <div class="bg-white p-3 rounded-lg shadow-sm flex items-center border border-gray-200">
                <img src="https://via.placeholder.com/100" alt="Produk" class="w-20 h-20 object-cover rounded-md bg-gray-200">
                <div class="ml-4 flex-1">
                    <h3 class="font-semibold text-gray-800 leading-tight">Produk Best Seller</h3>
                    <p class="text-blue-600 font-bold mt-1 text-sm">Rp 125.000</p>
                    <button class="mt-2 text-xs bg-gray-100 px-2 py-1 rounded text-gray-600 border border-gray-200">Best Quality</button>
                </div>
            </div>

        </div>
    </main>

    <footer class="max-w-md mx-auto p-6 text-center text-gray-400 text-xs">
        <p class="mb-2 uppercase tracking-widest">Lokasi Kami</p>
        <p class="mb-4 font-medium text-gray-600 italic">Rancaekek - Bandung, Jawa Barat</p>
        <div class="border-t border-gray-200 pt-4">
            <p>&copy; 2026 Powered by Saka Digital Solution</p>
        </div>
    </footer>

</body>
</html>
